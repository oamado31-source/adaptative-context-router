name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI routing smoke test
        run: |
          node dist/cli/index.js route --context-ratio 0.61 --available serena,jcodemunch "Find where authenticateUser is defined." | tee /tmp/acr-route.txt
          grep -q "selected: serena" /tmp/acr-route.txt
          node dist/cli/index.js route --context-ratio 0.11 --available serena,rtk,pxpipe "Change the button color." | tee /tmp/acr-no-opt.txt
          grep -q "selected: NO_OPTIMIZATION" /tmp/acr-no-opt.txt

      - name: CLI adapter planning smoke test
        run: |
          node dist/cli/index.js plan --json --context-ratio 0.61 --available serena "Find where authenticateUser is defined." | tee /tmp/acr-plan.txt
          grep -q '"adapterId": "serena"' /tmp/acr-plan.txt
          grep -q '"status": "planned"' /tmp/acr-plan.txt
          node dist/cli/index.js plan --json --context-ratio 0.11 --available serena,rtk,pxpipe "Change the button color." | tee /tmp/acr-plan-no-opt.txt
          grep -q '"status": "no-optimization"' /tmp/acr-plan-no-opt.txt

      - name: CLI telemetry smoke test
        run: |
          rm -rf .acr
          node dist/cli/index.js plan --record --context-ratio 0.61 --available serena "Find where authenticateUser is defined." | tee /tmp/acr-telemetry-plan.txt
          test -f .acr/telemetry/events.jsonl
          grep -q "telemetry-run:" /tmp/acr-telemetry-plan.txt
          if grep -Fq "Find where authenticateUser is defined." .acr/telemetry/events.jsonl; then
            echo "raw task leaked into telemetry" >&2
            exit 1
          fi
          node dist/cli/index.js telemetry summary --json | tee /tmp/acr-telemetry-summary.txt
          grep -q '"totalRuns": 1' /tmp/acr-telemetry-summary.txt
          grep -q '"serena": 1' /tmp/acr-telemetry-summary.txt

      - name: CLI benchmark comparison smoke test
        run: |
          cat > /tmp/acr-benchmark.json <<'JSON'
          {
            "case": {
              "id": "ci-synthetic-symbol-search",
              "taskType": "targeted_code_search",
              "strategy": "serena",
              "qualityTolerance": 0.02,
              "notes": "Synthetic CI fixture only; not project evidence."
            },
            "baseline": [
              {
                "arm": "baseline",
                "source": "measured",
                "inputTokens": 10000,
                "outputTokens": 1000,
                "latencyMs": 4000,
                "costUsd": 0.12,
                "success": true,
                "qualityScore": 0.96
              }
            ],
            "acr": [
              {
                "arm": "acr",
                "source": "measured",
                "inputTokens": 6000,
                "outputTokens": 1000,
                "latencyMs": 3500,
                "costUsd": 0.08,
                "success": true,
                "qualityScore": 0.95
              }
            ]
          }
          JSON
          node dist/cli/index.js benchmark compare --file /tmp/acr-benchmark.json | tee /tmp/acr-benchmark.txt
          grep -q "evidence: measured" /tmp/acr-benchmark.txt
          grep -q "outcome: acr-better" /tmp/acr-benchmark.txt
          grep -q "quality-gate: PASS" /tmp/acr-benchmark.txt
          node dist/cli/index.js benchmark compare --json --file /tmp/acr-benchmark.json | tee /tmp/acr-benchmark-json.txt
          grep -q '"measured": true' /tmp/acr-benchmark-json.txt
