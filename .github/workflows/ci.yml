name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI routing smoke test
        run: |
          node dist/cli/index.js route --context-ratio 0.61 --available serena,jcodemunch "Find where authenticateUser is defined." | tee /tmp/acr-route.txt
          grep -q "selected: serena" /tmp/acr-route.txt
          node dist/cli/index.js route --context-ratio 0.11 --available serena,rtk,pxpipe "Change the button color." | tee /tmp/acr-no-opt.txt
          grep -q "selected: NO_OPTIMIZATION" /tmp/acr-no-opt.txt
