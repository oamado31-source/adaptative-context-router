name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Release identity smoke test
        run: |
          node dist/cli/router.js version | tee /tmp/acr-version.txt
          grep -qx "0.2.0" /tmp/acr-version.txt
          node dist/cli/router.js status --json | tee /tmp/acr-status.txt
          grep -q '"version": "0.2.0"' /tmp/acr-status.txt
          grep -q '"milestone": "M13"' /tmp/acr-status.txt
          grep -q '"mode": "guarded"' /tmp/acr-status.txt
          grep -q '"status": "adaptive-ready"' /tmp/acr-status.txt

      - name: CLI routing smoke test
        run: |
          node dist/cli/index.js route --context-ratio 0.61 --available serena,jcodemunch "Find where authenticateUser is defined." | tee /tmp/acr-route.txt
          grep -q "selected: serena" /tmp/acr-route.txt
          node dist/cli/index.js route --context-ratio 0.11 --available serena,rtk,pxpipe "Change the button color." | tee /tmp/acr-no-opt.txt
          grep -q "selected: NO_OPTIMIZATION" /tmp/acr-no-opt.txt

      - name: CLI adapter planning smoke test
        run: |
          node dist/cli/index.js plan --json --context-ratio 0.61 --available serena "Find where authenticateUser is defined." | tee /tmp/acr-plan.txt
          grep -q '"adapterId": "serena"' /tmp/acr-plan.txt
          grep -q '"status": "planned"' /tmp/acr-plan.txt
          node dist/cli/index.js plan --json --context-ratio 0.11 --available serena,rtk,pxpipe "Change the button color." | tee /tmp/acr-plan-no-opt.txt
          grep -q '"status": "no-optimization"' /tmp/acr-plan-no-opt.txt

      - name: CLI telemetry smoke test
        run: |
          rm -rf .acr
          node dist/cli/index.js plan --record --context-ratio 0.61 --available serena "Find where authenticateUser is defined." | tee /tmp/acr-telemetry-plan.txt
          test -f .acr/telemetry/events.jsonl
          grep -q "telemetry-run:" /tmp/acr-telemetry-plan.txt
          if grep -Fq "Find where authenticateUser is defined." .acr/telemetry/events.jsonl; then
            echo "raw task leaked into telemetry" >&2
            exit 1
          fi
          node dist/cli/index.js telemetry summary --json | tee /tmp/acr-telemetry-summary.txt
          grep -q '"totalRuns": 1' /tmp/acr-telemetry-summary.txt
          grep -q '"serena": 1' /tmp/acr-telemetry-summary.txt

      - name: CLI provider measurement smoke test
        run: |
          rm -rf .acr
          node dist/cli/index.js plan --record --context-ratio 0.61 --available serena "Find where authenticateUser is defined." | tee /tmp/acr-provider-plan.txt
          RUN_ID="$(awk '/telemetry-run:/ {print $2}' /tmp/acr-provider-plan.txt | tail -n 1)"
          test -n "$RUN_ID"
          cat > /tmp/acr-claude-result.json <<'JSON'
          {
            "type": "result",
            "subtype": "success",
            "is_error": false,
            "duration_ms": 2480,
            "duration_api_ms": 2110,
            "num_turns": 3,
            "result": "SYNTHETIC RESPONSE CONTENT THAT MUST NOT BE PERSISTED",
            "session_id": "synthetic-session-secret-value",
            "total_cost_usd": 0.042,
            "usage": {
              "input_tokens": 1200,
              "output_tokens": 180,
              "cache_read_input_tokens": 640,
              "cache_creation_input_tokens": 90
            }
          }
          JSON
          node dist/cli/router.js measurement import-claude --file /tmp/acr-claude-result.json --run "$RUN_ID" --json | tee /tmp/acr-provider-import.txt
          grep -q '"inputTokens": 1200' /tmp/acr-provider-import.txt
          grep -q '"estimatedCostUsd": 0.042' /tmp/acr-provider-import.txt
          grep -q '"costProvenance": "claude-code-client-estimate"' /tmp/acr-provider-import.txt
          grep -q '"costUsd":null' .acr/telemetry/events.jsonl
          grep -q '"estimatedCostUsd":0.042' .acr/telemetry/events.jsonl
          if grep -Fq "synthetic-session-secret-value" .acr/telemetry/events.jsonl; then
            echo "raw Claude session id leaked into telemetry" >&2
            exit 1
          fi
          if grep -Fq "SYNTHETIC RESPONSE CONTENT THAT MUST NOT BE PERSISTED" .acr/telemetry/events.jsonl; then
            echo "raw Claude response leaked into telemetry" >&2
            exit 1
          fi
          node dist/cli/index.js telemetry summary --json | tee /tmp/acr-provider-summary.txt
          grep -q '"measuredCostUsd": 0' /tmp/acr-provider-summary.txt
          grep -q '"providerEstimatedCostUsd": 0.042' /tmp/acr-provider-summary.txt
          node dist/cli/router.js measurement help | tee /tmp/acr-measurement-help.txt
          grep -q "acr measurement import-claude" /tmp/acr-measurement-help.txt

      - name: CLI benchmark comparison smoke test
        run: |
          cat > /tmp/acr-benchmark.json <<'JSON'
          {
            "case": {
              "id": "ci-synthetic-symbol-search",
              "taskType": "targeted_code_search",
              "strategy": "serena",
              "qualityTolerance": 0.02,
              "notes": "Synthetic CI fixture only; not project evidence."
            },
            "baseline": [
              {
                "arm": "baseline",
                "source": "measured",
                "inputTokens": 10000,
                "outputTokens": 1000,
                "latencyMs": 4000,
                "costUsd": 0.12,
                "success": true,
                "qualityScore": 0.96
              }
            ],
            "acr": [
              {
                "arm": "acr",
                "source": "measured",
                "inputTokens": 6000,
                "outputTokens": 1000,
                "latencyMs": 3500,
                "costUsd": 0.08,
                "success": true,
                "qualityScore": 0.95
              }
            ]
          }
          JSON
          node dist/cli/index.js benchmark compare --file /tmp/acr-benchmark.json | tee /tmp/acr-benchmark.txt
          grep -q "evidence: measured" /tmp/acr-benchmark.txt
          grep -q "outcome: acr-better" /tmp/acr-benchmark.txt
          grep -q "quality-gate: PASS" /tmp/acr-benchmark.txt
          node dist/cli/index.js benchmark compare --json --file /tmp/acr-benchmark.json | tee /tmp/acr-benchmark-json.txt
          grep -q '"measured": true' /tmp/acr-benchmark-json.txt

      - name: CLI real benchmark corpus smoke test
        run: |
          node dist/cli/router.js benchmark corpus validate --file benchmarks/corpus/real-v1.json --json | tee /tmp/acr-real-corpus.txt
          grep -q '"valid": true' /tmp/acr-real-corpus.txt
          grep -q '"execution": false' /tmp/acr-real-corpus.txt
          grep -q '"evidenceMode": "real"' /tmp/acr-real-corpus.txt
          grep -q '"totalCases": 6' /tmp/acr-real-corpus.txt
          grep -q '"revision": "7fb35b8a8777cc39b986ec4661e21b66875b1623"' /tmp/acr-real-corpus.txt
          node dist/cli/router.js benchmark corpus help | tee /tmp/acr-real-corpus-help.txt
          grep -q "does not run Claude Code" /tmp/acr-real-corpus-help.txt
          grep -q "does not.*claim token savings" /tmp/acr-real-corpus-help.txt

      - name: CLI evidence-driven calibration smoke test
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function observation(arm, inputTokens) {
            return {
              arm,
              source: 'measured',
              inputTokens,
              outputTokens: 0,
              cacheReadTokens: 0,
              cacheWriteTokens: 0,
              latencyMs: arm === 'baseline' ? 1000 : 900,
              success: true,
              qualityScore: 0.96,
            };
          }
          function fixture(id, acrInput) {
            return {
              case: {
                id,
                taskType: 'targeted_code_search',
                strategy: 'serena',
                qualityTolerance: 0.02,
                notes: 'Synthetic CI calibration fixture only; not project evidence.',
              },
              baseline: Array.from({ length: 3 }, () => observation('baseline', 1000)),
              acr: Array.from({ length: 3 }, () => observation('acr', acrInput)),
            };
          }
          fs.writeFileSync('/tmp/acr-cal-a.json', JSON.stringify(fixture('ci-cal-a', 800), null, 2));
          fs.writeFileSync('/tmp/acr-cal-b.json', JSON.stringify(fixture('ci-cal-b', 700), null, 2));
          NODE
          node dist/cli/router.js calibrate analyze --file /tmp/acr-cal-a.json --file /tmp/acr-cal-b.json --json | tee /tmp/acr-calibration.txt
          grep -q '"measured": true' /tmp/acr-calibration.txt
          grep -q '"policyMutation": false' /tmp/acr-calibration.txt
          grep -q '"strategyId": "serena"' /tmp/acr-calibration.txt
          grep -q '"disposition": "promote"' /tmp/acr-calibration.txt
          grep -q '"evidenceCases": 2' /tmp/acr-calibration.txt
          node dist/cli/router.js calibrate help | tee /tmp/acr-calibration-help.txt
          grep -q "Accepts measured benchmark inputs only" /tmp/acr-calibration-help.txt
          grep -q "does not modify policies/default.yaml" /tmp/acr-calibration-help.txt
          if node dist/cli/router.js calibrate analyze --file /tmp/acr-cal-a.json --apply >/tmp/acr-cal-apply.txt 2>&1; then
            echo "automatic calibration mutation unexpectedly succeeded" >&2
            exit 1
          fi
          grep -qi "advisory only" /tmp/acr-cal-apply.txt

      - name: CLI dashboard smoke test
        run: |
          rm -f /tmp/acr-dashboard-demo.html /tmp/acr-dashboard-local.html
          node dist/cli/router.js demo dashboard --output /tmp/acr-dashboard-demo.html | tee /tmp/acr-dashboard-demo.txt
          test -s /tmp/acr-dashboard-demo.html
          grep -q "SYNTHETIC DEMO" /tmp/acr-dashboard-demo.html
          grep -q "synthetic-symbol-search" /tmp/acr-dashboard-demo.html
          grep -q "NO_OPTIMIZATION" /tmp/acr-dashboard-demo.html
          if grep -Eq 'https?://|<script[^>]+src=' /tmp/acr-dashboard-demo.html; then
            echo "dashboard contains a remote dependency" >&2
            exit 1
          fi
          node dist/cli/router.js dashboard build --benchmark /tmp/acr-benchmark.json --output /tmp/acr-dashboard-local.html | tee /tmp/acr-dashboard-local.txt
          test -s /tmp/acr-dashboard-local.html
          grep -q "Local ACR telemetry" /tmp/acr-dashboard-local.html
          grep -q "ci-synthetic-symbol-search" /tmp/acr-dashboard-local.html
          grep -q "Routing ≠ proof" /tmp/acr-dashboard-local.html
          node dist/cli/router.js help | tee /tmp/acr-help.txt
          grep -q "acr dashboard build" /tmp/acr-help.txt

      - name: CLI execution bridge smoke test
        run: |
          node dist/cli/router.js bridge help | tee /tmp/acr-bridge-help.txt
          grep -q "acr bridge rtk rewrite" /tmp/acr-bridge-help.txt
          grep -q "acr bridge serena find-symbol" /tmp/acr-bridge-help.txt
          grep -q "ACR does not execute the rewritten shell command" /tmp/acr-bridge-help.txt
