# Reproducible Serena project configuration for ACR.
# Local Serena caches, memories, and runtime metadata remain ignored by Git.
project_name: "adaptative-context-router"

language_servers:
  - typescript

ignore_all_files_in_gitignore: true
ignored_paths: []

read_only: false
excluded_tools: []
included_optional_tools: []

encoding: utf-8
fixed_tools: []
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}

activation_command:
activation_command_timeout: 180.0

ls_workspace_folders:
  - "."
ls_additional_workspace_folders: []
